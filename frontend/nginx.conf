server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files directly
    location / {
        # Try to serve file directly, fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve caching for static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
      expires 1M;
      access_log off;
      add_header Cache-Control "public";
    }

    # Optional: Disable access logs for favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Optional: Disable access logs for robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Optional: Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
