server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # This block is important for production. It proxies API requests
  # from the frontend's server to the backend service, avoiding CORS issues.
  location /api {
    # The address of the backend service. In a Docker Compose or Kubernetes
    # setup, 'backend' would be the service name.
    proxy_pass http://backend:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
